name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-26 carries Xcode 26.6 by default, which is the toolchain Package.swift targets.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        # CI=true is set by Actions; the keychain round-trips skip themselves under it.
        run: swift test
